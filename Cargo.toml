[package]
name = "agent-calendar"
version = "0.1.9"
edition = "2024"
rust-version = "1.88"
description = "Local calendar for Claude Code and Codex sessions: summaries, time and cost per project, conversation history, continue and schedule agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uiuifree/agent-calendar"
homepage = "https://github.com/uiuifree/agent-calendar"
readme = "README.md"
keywords = ["claude-code", "codex", "timesheet", "calendar", "ai-agent"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = [".github", ".idea", "web/node_modules"]

[[bin]]
name = "agent-calendar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
mime_guess = "2"
rust-embed = "8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rcgen = "0.14.10"
rustls = "0.23.45"
sha2 = "0.11.0"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json", "query"] }
futures-util = { version = "0.3.34", default-features = false }
base64 = "0.23.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
