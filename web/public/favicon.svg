      <rect width="32" height="32" fill="#fff"/>
      <rect x="9" y="-1" width="3" height="6" rx="1.5" fill="#000"/>
      <rect x="20" y="-1" width="3" height="6" rx="1.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="6" fill="#6d28d9" mask="url(#binding)"/>
  <g fill="#fff">
    <path d="M7.8 11.3l2.6 2.2-2.6 2.2" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="square"/>
    <rect x="13.5" y="11" width="5" height="5" rx="1"/>
    <rect x="20" y="11" width="5" height="5" rx="1"/>
    <rect x="7" y="18.5" width="5" height="5" rx="1"/>
    <rect x="13.5" y="18.5" width="5" height="5" rx="1"/>
    <path d="M22.5 17C23.06 20.44 23.06 20.44 26.5 21C23.06 21.56 23.06 21.56 22.5 25C21.94 21.56 21.94 21.56 18.5 21C21.94 20.44 21.94 20.44 22.5 17Z"/>
  </g>
</svg>
